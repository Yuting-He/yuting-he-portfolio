name: Refresh and deploy portfolio

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install data-adapter dependencies
        run: npm ci

      - name: Run model, historical snapshot, spatial and page-contract tests
        run: npm test

      - name: Refresh observed, soil-water and ICON ensemble snapshot
        id: refresh
        run: npm run refresh-data

      - name: Verify snapshot freshness at publication time
        id: publication-check
        run: node scripts/check-live-freshness.mjs

      - name: Summarize refresh and publication status
        if: always()
        env:
          HEATLENS_REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          HEATLENS_PUBLICATION_OUTCOME: ${{ steps.publication-check.outcome }}
        run: node scripts/check-live-freshness.mjs --summary

      - name: Save refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heatlens-refresh-diagnostics
          path: |
            artifacts/refresh-status.json
            artifacts/publication-status.json
          if-no-files-found: warn
          retention-days: 14

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site artifact
        shell: bash
        run: |
          mkdir _site
          cp .nojekyll index.html styles.css heatwave-demo.html heatwave-demo.css heatwave-demo.js heatwave-model.js heatwave-state.js heatwave-warnings.js heatwave-language.js heatwave-language-de.js heatwave-i18n.js LICENSE THIRD_PARTY_NOTICES.md _site/
          cp -R assets vendor _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
