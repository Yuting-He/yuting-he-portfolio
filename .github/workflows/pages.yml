name: Refresh and deploy portfolio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.number) || '' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install data-adapter dependencies
        run: npm ci

      - name: Run model, historical snapshot, spatial and page-contract tests
        run: npm test

      - name: Refresh observed, soil-water and ICON ensemble snapshot
        id: refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run refresh-data

      - name: Reuse the last validated snapshot for an ordinary site edit
        id: reuse
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: node scripts/reuse-published-data.mjs

      - name: Validate live or saved data for publication
        id: publication-check
        env:
          HEATLENS_EVENT: ${{ github.event_name }}
        run: |
          if [ "$HEATLENS_EVENT" = "push" ] || [ "$HEATLENS_EVENT" = "pull_request" ]; then
            node scripts/check-live-freshness.mjs --saved
          else
            node scripts/check-live-freshness.mjs
          fi

      - name: Build immutable HeatLens data assets
        run: node scripts/build-heatlens-assets.mjs

      - name: Install Chromium for browser regression checks
        run: npx playwright install --with-deps chromium

      - name: Verify real HeatLens workbench flows
        run: npm run test:browser

      - name: Assemble and verify static site dependencies
        run: node scripts/assemble-site.mjs

      - name: Recheck source freshness immediately before publication
        env:
          HEATLENS_EVENT: ${{ github.event_name }}
        run: |
          if [ "$HEATLENS_EVENT" = "push" ] || [ "$HEATLENS_EVENT" = "pull_request" ]; then
            node scripts/check-live-freshness.mjs --saved
          else
            node scripts/check-live-freshness.mjs
          fi

      - name: Summarize refresh and publication status
        if: always()
        env:
          HEATLENS_REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          HEATLENS_REUSE_OUTCOME: ${{ steps.reuse.outcome }}
          HEATLENS_PUBLICATION_OUTCOME: ${{ steps.publication-check.outcome }}
        run: node scripts/check-live-freshness.mjs --summary

      - name: Save refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heatlens-refresh-diagnostics
          path: |
            artifacts/refresh-status.json
            artifacts/reuse-status.json
            artifacts/publication-status.json
            artifacts/browser-results
            artifacts/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
